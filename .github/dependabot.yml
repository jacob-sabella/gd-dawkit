version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    reviewers:
      - jacob-sabella
    groups:
      actions:
        patterns:
          - "*"

  # native/godot-cpp is a submodule; a bump of its pin arrives as a PR the suite runs against.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    reviewers:
      - jacob-sabella
