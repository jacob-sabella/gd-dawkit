name: CI

# dawkit's own checks, headless, on every push to main and every pull request: the native core
# (cached on its sources and godot-cpp's pin), then tools/test.sh.
#
# The tests are off here for now (2026-10-30, as in dawlings: they run locally): the native core is
# built and the project imported, so a build or a script that breaks still fails, and the tests run
# again with the repository variable RUN_TESTS set to true (gh variable set RUN_TESTS --body true).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    # Skip fork PRs; internal pushes, PRs and manual runs proceed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake g++ pkg-config libx11-dev flac

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot
        run: |
          if [ ! -x ~/godot-bin/godot ]; then
            base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
            curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mkdir -p ~/godot-bin
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
            rm -f godot.zip
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot

      - name: Cache the native core
        uses: actions/cache@v6
        with:
          path: |
            native/build
            native/extension_api.json
          key: dawkit-native-${{ hashFiles('native/**/*.cpp', 'native/**/*.h', 'native/CMakeLists.txt', 'tools/build_native.sh') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: dawkit-native-

      - name: Build and import
        if: vars.RUN_TESTS != 'true'
        run: |
          tools/build_native.sh
          godot --headless --path . --import 2>&1 | tee import.log || true
          ! grep -E "SCRIPT ERROR|Parse Error" import.log

      - name: Tests
        if: vars.RUN_TESTS == 'true'
        run: tools/test.sh
